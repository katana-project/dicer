name: Build binaries

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [386, amd64, arm64]
        exclude:
          - goos: darwin
            goarch: 386

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Build web interface
        run: |
          cd web
          corepack pnpm install
          corepack pnpm build
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -v -ldflags="-s -w" -o build/cutter_${GOOS}_${GOARCH} ./cmd/cutter
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutter_${{ matrix.goos }}_${{ matrix.goarch }}
          path: build/cutter_${{ matrix.goos }}_${{ matrix.goarch }}

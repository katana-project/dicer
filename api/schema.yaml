openapi: 3.0.0

info:
  title: cutter
  version: 1.0.0
  description: REST API for remote JVM instrumentation.
  contact:
    name: Matouš Kučera
    email: root@slicer.run

servers:
  - url: /api

paths:
  /health:
    get:
      summary: Health check
      description: Check if the service is running.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2023-10-01T12:00:00Z"

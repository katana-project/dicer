openapi: 3.0.0

info:
  title: dicer
  version: 1.0.0
  description: REST API for remote JVM instrumentation.
  contact:
    name: Matouš Kučera
    email: root@slicer.run

servers:
  - url: /api

paths:
  /health:
    get:
      summary: Health check
      description: Checks if the service is running.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2023-10-01T12:00:00Z"
  /instances:
    get:
      summary: List JVM instances
      description: Returns a list of JVM instances that are currently running on the host system.
      responses:
        '200':
          description: List of JVM instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instance'

components:
  schemas:
    Instance:
      type: object
      required:
        - id
        - display_name
        - properties
      properties:
        id:
          type: string
          description: Unique identifier for the JVM instance, usually the PID.
          example: "12345"
        display_name:
          type: string
          description: Human-readable name of the JVM instance, usually the command-line.
          example: "java -jar TestApp-1.0.jar"
        properties:
          type: object
          description: System properties of the JVM instance.
          additionalProperties:
            type: string
